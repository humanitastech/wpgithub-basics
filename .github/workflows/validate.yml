name: Validate basics

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Run offline security regressions
        run: php tests/security.php
      - name: Build installable basics package
        shell: pwsh
        run: ./build-package.ps1
